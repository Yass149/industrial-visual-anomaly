<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inspect a product image</title>
<style>
body{font:17px/1.6 system-ui,sans-serif;color:#202b35;background:#f6f7f8;max-width:760px;margin:40px auto;padding:0 20px}h1{line-height:1.2}label{display:block;border:2px dashed #67798b;border-radius:8px;padding:26px;background:white}input{display:block;max-width:100%;margin-top:16px}button{padding:12px 20px;font:inherit;margin:18px 0;background:#173e58;color:white;border:0;border-radius:5px}button:disabled{opacity:.5}img{max-width:100%;width:448px}#status{min-height:28px}small{display:block}a{color:#17476a}
</style></head><body>
<h1>Inspect a product image</h1><p id="category">Checking service…</p>
<form id="form"><label id="drop">Drop an image here, or choose a file.<input id="file" type="file" accept="image/*" required></label><button id="submit" disabled>Inspect image</button></form>
<p id="status" role="status" aria-live="polite"></p><div id="result" hidden><p id="decision"></p><img id="overlay" alt="Anomaly heatmap blended onto the centre crop"><p id="score"></p><small>The score is a distance, not a probability. Colours use fixed calibration bounds. The image is resized and centre-cropped; defects at the edges can be missed.</small><p id="drift"></p></div>
<script>
const file=document.getElementById('file'),status=document.getElementById('status'),button=document.getElementById('submit');
fetch('/health').then(r=>{if(!r.ok)throw Error('Service is not ready');return r.json()}).then(d=>{document.getElementById('category').textContent='Configured product: '+d.category+'. Upload this product category only.';button.disabled=false}).catch(e=>status.textContent=e.message);
const drop=document.getElementById('drop');drop.addEventListener('dragover',e=>e.preventDefault());drop.addEventListener('drop',e=>{e.preventDefault();if(e.dataTransfer.files.length){file.files=e.dataTransfer.files}});
document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();if(!file.files.length)return;button.disabled=true;status.textContent='Inspecting…';document.getElementById('result').hidden=true;try{const data=new FormData();data.append('file',file.files[0]);const response=await fetch('/predict',{method:'POST',body:data});const r=await response.json();if(!response.ok)throw Error(typeof r.detail==='string'?r.detail:'Please choose a valid image.');document.getElementById('decision').textContent=r.is_anomaly?'Flagged for inspection':'Not flagged at this threshold';document.getElementById('score').textContent='Score '+r.anomaly_score.toFixed(3)+' · threshold '+r.threshold.toFixed(3)+' · processing '+Math.round(r.latency_ms)+' ms';document.getElementById('overlay').src='data:image/png;base64,'+r.heatmap_base64;document.getElementById('drift').textContent=r.monitoring.last_check?.drift_detected?'Recent images differ from the training reference. Investigate the camera and products.':'Drift monitoring: '+r.monitoring.pending_images+' / '+r.monitoring.window_size+' images in this window.';document.getElementById('result').hidden=false;status.textContent='Inspection complete.'}catch(err){status.textContent=err.message}finally{button.disabled=false}});
</script></body></html>
